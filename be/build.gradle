plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ev_charger'
version = '0.0.1-SNAPSHOT'
description = 'be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 4.0.8 기본 netty(4.2.17)의 취약점(CVE-2026-89044 등) 회피
// Boot가 이 버전 이상을 관리하게 되면 삭제
ext['netty.version'] = '4.2.19.Final'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    // postgreSql
    runtimeOnly 'org.postgresql:postgresql'
    // lombok
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.security:spring-security-test'
    // testcontainers (PostGIS 테스트 DB)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    //spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // google oauth
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // 구글 idToken 서명 검증 (GoogleIdTokenVerifier)
    implementation 'com.google.api-client:google-api-client:2.2.0'
    // 뭔지 몰라서 일단 안지움
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    // geography
    // 버전은 Spring Boot가 관리 (hibernate-core와 버전 맞춤)
    implementation 'org.hibernate.orm:hibernate-spatial'
    // spring boot web 스타터
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // FCM
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    // 재시도(@Retryable)
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    // 지워도 될 듯
    implementation 'org.aspectj:aspectjweaver:1.9.22'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    constraints {
        // firebase-admin, google-api-client가 끌어오는 guava 31.1의 취약점(CVE-2023-2976, CVE-2020-8908) 회피
        implementation('com.google.guava:guava:33.4.8-jre')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}